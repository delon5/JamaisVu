name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
    steps:
      - uses: actions/checkout@v4

      - name: Install VitaSDK (official vdpm bootstrap) and taiHEN
        env:
          VDPM_NONINTERACTIVE: "1"
        run: |
          git clone --depth 1 https://github.com/vitasdk/vdpm
          ./vdpm/bootstrap-vitasdk.sh
          export PATH="$VITASDK/bin:$PATH"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          # use the vdpm installed into the SDK (the repo's helper scripts
          # can lag behind the package client layout)
          if [ ! -f "$VITASDK/arm-vita-eabi/lib/libtaihenForKernel_stub.a" ]; then
            "$VITASDK/bin/vdpm" install taihen || "$VITASDK/bin/vdpm" taihen
          fi
          ls "$VITASDK/arm-vita-eabi/lib/" | grep -i taihen
          ls "$VITASDK/arm-vita-eabi/include/taihen.h"

      - name: Build JamaisVu (plugin + payload)
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"

      - name: Build JamaisVu testing build (also arms on 3.60)
        run: |
          mkdir -p build-testing && cd build-testing
          cmake .. -DCMAKE_BUILD_TYPE=Release -DJAMAISVU_TESTING=ON
          make -j"$(nproc)"

      - name: Payload must not use the FPU
        run: |
          # The payload runs with the FPU off (it is off on 3.60 at that
          # point): a single VFP/NEON instruction is an undefined
          # instruction there. Built with -mgeneral-regs-only; verify.
          for d in build build-testing; do
            n=$("$VITASDK/bin/arm-vita-eabi-objdump" -d "$d/payload/JamaisVu_payload" \
                 | grep -cE '\sv[a-z0-9.]+\s' || true)
            echo "$d: $n VFP/NEON instructions"
            [ "$n" -eq 0 ]
          done

      - name: Build jvdump
        run: |
          mkdir -p tools/jvdump/build && cd tools/jvdump/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"

      - name: Host tests (payload save/load, slot policy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs
          tests/host/run.sh

      - name: Collect binaries
        run: |
          mkdir -p out
          cp build/JamaisVu.skprx out/
          cp build-testing/JamaisVu.skprx out/JamaisVu-testing.skprx
          cp tools/jvdump/build/jvdump.skprx out/
          # payload ELF with symbols: maps a crash address from log.txt
          cp build-testing/payload/JamaisVu_payload out/JamaisVu_payload-testing.elf
          sha256sum out/*.skprx | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: JamaisVu-${{ github.sha }}
          path: out/
