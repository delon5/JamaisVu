name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
    steps:
      - uses: actions/checkout@v4

      # The installed SDK is kept between runs: the bootstrap downloads its
      # seed from GitHub releases, which has been unreachable for hours at a
      # time (2026-11-08), and with the cache a build needs no download.
      # Bump the key to pick up a newer SDK.
      - name: Cached VitaSDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VITASDK }}
          key: vitasdk-${{ runner.os }}-seed-0.1.6-channel-2026.08-taihen

      - name: Install VitaSDK (official vdpm bootstrap) and taiHEN
        env:
          VDPM_NONINTERACTIVE: "1"
        run: |
          if [ ! -x "$VITASDK/bin/arm-vita-eabi-gcc" ]; then
            rm -rf "$VITASDK"
            git clone --depth 1 https://github.com/vitasdk/vdpm
            # the seed download fails outright while GitHub's release
            # downloads are down: a few attempts, a minute apart
            for attempt in 1 2 3 4 5; do
              ./vdpm/bootstrap-vitasdk.sh && break
              echo "bootstrap attempt $attempt failed"
              rm -rf "$VITASDK"
              [ "$attempt" = 5 ] && exit 1
              sleep 60
            done
          fi
          export PATH="$VITASDK/bin:$PATH"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"
          # use the vdpm installed into the SDK (the repo's helper scripts
          # can lag behind the package client layout)
          if [ ! -f "$VITASDK/arm-vita-eabi/lib/libtaihenForKernel_stub.a" ]; then
            "$VITASDK/bin/vdpm" install taihen || "$VITASDK/bin/vdpm" taihen
          fi
          ls "$VITASDK/arm-vita-eabi/lib/" | grep -i taihen
          ls "$VITASDK/arm-vita-eabi/include/taihen.h"

      - name: Build JamaisVu (plugin + payload; arms on 3.60 and 3.65)
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          # on a failure, show the plugin's segments (vita-elf-create needs
          # room for its SCE data between segment 0 and segment 1)
          make -j"$(nproc)" || {
            "$VITASDK/bin/arm-vita-eabi-readelf" -lSW JamaisVu || true
            exit 1
          }

      # the release configuration must keep compiling too (no Diagnostics)
      - name: Release-configured build
        run: |
          mkdir -p build-release && cd build-release
          cmake .. -DCMAKE_BUILD_TYPE=Release -DJAMAISVU_RELEASE=ON -DJAMAISVU_VERSION=0.0.0-ci
          make -j"$(nproc)" JamaisVu.skprx-self 2>/dev/null || make -j"$(nproc)"

      - name: Payload ARM/Thumb interworking
        run: |
          # The C code is Thumb, start.S is ARM. Calls from C into start.S
          # must be BLX; a plain BL ran jv_recover's ARM code in Thumb state
          # (build ee965f0: crash recovery crashed again on hardware).
          for d in build; do
            dis=$("$VITASDK/bin/arm-vita-eabi-objdump" -d "$d/payload/JamaisVu_payload")
            if echo "$dis" | grep -E $'\tbl\t[0-9a-f]+ <jv_recover>'; then
              echo "$d: plain BL into ARM code"; exit 1
            fi
            echo "$dis" | grep -E $'\tblx\t[0-9a-f]+ <jv_recover>' \
              || { echo "$d: no BLX to jv_recover"; exit 1; }
            # resume.S jumps to PAYLOAD_PADDR: _start must be first
            "$VITASDK/bin/arm-vita-eabi-nm" "$d/payload/JamaisVu_payload" \
              | grep -q '^1c000000 T _start$' || { echo "$d: _start not at 0x1c000000"; exit 1; }
          done

      - name: Build jvdump
        run: |
          mkdir -p tools/jvdump/build && cd tools/jvdump/build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j"$(nproc)"

      - name: Host tests (payload save/load, slot policy)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq exfatprogs
          tests/host/run.sh

      - name: Collect binaries
        run: |
          mkdir -p out
          cp build/JamaisVu.skprx out/
          cp tools/jvdump/build/jvdump.skprx out/
          # Japanese game names (copy to ux0:data/JamaisVu/)
          cp plugin/gui/jpfont.bin out/
          # payload ELF with symbols: maps a crash address from log.txt
          cp build/payload/JamaisVu_payload out/JamaisVu_payload.elf
          sha256sum out/*.skprx | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: JamaisVu-${{ github.sha }}
          path: out/
