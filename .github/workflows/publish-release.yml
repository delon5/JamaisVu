# Publishes a draft release made by release.yml (its tag is created on
# publish). Run by hand with the tag, e.g. v2.0.0-rc1. If CHANGELOG.md
# has a section for the version and the draft's notes do not carry it
# yet, the section is put in front of them first.
name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft release to publish, e.g. v2.0.0-rc1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if python3 tools/release_notes.py "${TAG#v}" > notes.md; then
            gh release view "$TAG" --json body --jq .body > body.md
            if ! grep -qF -- "$(head -n 1 notes.md | cut -c1-60)" body.md; then
              { echo; cat body.md; } >> notes.md
              gh release edit "$TAG" --notes-file notes.md
            fi
          fi
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft,url
